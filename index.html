<html lang="en">
<head>

<title>SyncParty</title>
<meta name="theme-color" content="#07070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<style>:root{--bg:#07070b;--s1:#101018;--s2:#171722;--s3:#20202e;--line:#ffffff14;--tx:#f4f4fa;--mu:#9a9ab0;--p:#8b5cf6;--b:#3b82f6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:20px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100dvh;background:radial-gradient(900px 500px at 15% -10%,#8b5cf633,transparent 60%),radial-gradient(800px 500px at 100% 0,#3b82f61f,transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
h1{font-size:2rem;line-height:1.1;margin:.4rem 0 .6rem;letter-spacing:-.03em;text-align:center}
h2{font-size:1.5rem;margin:0 0 .3rem;letter-spacing:-.02em}h3{margin:0;font-size:1.05rem}h4{margin:1.1rem 0 .4rem;color:var(--mu);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.grad{background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);text-align:center;margin:.2rem 0 1rem;max-width:34ch}.fine{color:var(--mu);font-size:.8rem;margin:.5rem 0}.c{text-align:center}
.screen{padding:calc(var(--sat) + 24px) 22px calc(var(--sab) + 28px);display:flex;flex-direction:column;gap:12px;min-height:100dvh}
.screen.center{align-items:center;justify-content:center;text-align:center}.screen.center>*{width:100%}.screen.center .sub,.screen.center h1,.screen.center h2{width:auto}
.fade{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.logo{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:600;justify-content:center;margin-bottom:6px}.logo b{color:var(--b);font-weight:700}
.logo-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 8px 28px #8b5cf655}.logo-mark svg{width:20px;fill:#fff}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}.field span{color:var(--mu);font-size:.82rem}
input[type=text],input:not([type]),input.mono{background:var(--s2);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:14px 16px;font-size:1rem;outline:none;width:100%}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px #8b5cf633}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}
.btn{appearance:none;border:0;border-radius:16px;padding:12px 18px;font:inherit;font-weight:600;color:var(--tx);background:var(--s3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .12s,filter .2s;text-align:center}
.btn:active{transform:scale(.97)}.btn.big{width:100%;padding:16px;font-size:1.05rem}.btn.sm{padding:8px 14px;min-height:36px;font-size:.88rem;border-radius:12px}.btn.wide{width:100%;margin-top:10px}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 10px 30px #6d4cf055}.btn.soft{background:var(--s2);border:1px solid var(--line)}.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ok{background:#10b98126;color:var(--ok)}.btn.danger{background:#ef444422;color:var(--bad)}.btn svg{width:16px;fill:currentColor}.btn[disabled]{opacity:.4}
.back{align-self:flex-start;background:none;border:0;color:var(--mu);font:inherit;padding:6px 0;cursor:pointer}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left}.warn-card{border-color:#fbbf2455;color:var(--warn)}
.row{display:flex;gap:10px;justify-content:center}.row .btn{flex:1}
.code{font:700 2.3rem ui-monospace,Menlo,monospace;letter-spacing:.12em;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:.4rem 0}.code i{display:inline-block;width:.35em}
.qr{background:#fff;padding:14px;border-radius:20px;width:210px!important;height:210px;margin:6px auto}.qr svg{width:100%;height:100%;display:block}.qr.sm{width:150px!important;height:150px;padding:10px}
.pulse{display:flex;gap:8px;justify-content:center;margin-bottom:14px}.pulse i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--b));animation:pl 1.2s infinite ease-in-out}.pulse i:nth-child(2){animation-delay:.15s}.pulse i:nth-child(3){animation-delay:.3s}
@keyframes pl{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
/* player */
.player{padding:calc(var(--sat) + 10px) 18px calc(var(--sab) + 40px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.hd{min-width:0}.hd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd small{color:var(--mu)}
.hdr{display:flex;align-items:center;gap:6px}.ibtn{position:relative;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--tx);display:grid;place-items:center;cursor:pointer}.ibtn svg{width:20px;fill:currentColor}
.badge{position:absolute;top:-5px;right:-5px;background:var(--p);color:#fff;border-radius:99px;font-size:.7rem;font-style:normal;padding:1px 6px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:6px 10px;border-radius:99px;background:var(--s1);border:1px solid var(--line);white-space:nowrap}.pill i,.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok);box-shadow:0 0 8px currentColor}
.pill.ok i,.dot.ok{background:var(--ok);color:var(--ok)}.pill.warn i,.dot.warn{background:var(--warn);color:var(--warn)}.pill.bad i,.dot.bad{background:var(--bad);color:var(--bad)}.dot{margin-right:6px}
.now{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 14px}
.art{width:min(76vw,320px);aspect-ratio:1;border-radius:30px;position:relative;display:grid;place-items:center;box-shadow:0 24px 70px #0009,0 0 80px -10px #8b5cf655;overflow:hidden}.art svg{width:34%;fill:#ffffffcc;position:relative}.art-glow{position:absolute;inset:-30%;background:radial-gradient(circle at 30% 20%,#ffffff44,transparent 50%)}
.art.spin svg{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:scale(1.12)}}
.ttl{text-align:center;max-width:100%}.ttl h2{font-size:1.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ttl p{margin:0;color:var(--mu)}
.prog{width:100%}.times{display:flex;justify-content:space-between;color:var(--mu);font-size:.78rem;margin-top:2px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:var(--s3)}input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:var(--s3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px;box-shadow:0 2px 10px #0008}input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
input[type=range]:disabled{opacity:.55}
.ctl{display:flex;align-items:center;gap:22px;margin-top:2px}.cbtn{width:60px;height:60px;border-radius:50%;border:0;background:var(--s2);display:grid;place-items:center;color:var(--tx);cursor:pointer;transition:transform .12s}.cbtn:active{transform:scale(.92)}.cbtn svg{width:26px;fill:currentColor}
.cbtn.main{width:80px;height:80px;background:linear-gradient(135deg,var(--p),var(--b));box-shadow:0 14px 40px #6d4cf066}.cbtn.main svg{width:34px}.cbtn[disabled]{opacity:.4}
.vol{display:flex;align-items:center;gap:10px;width:70%;color:var(--mu)}.vol svg{width:20px;fill:currentColor;flex:none}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--mu);margin:6px 0}.eqbars{display:flex;gap:5px;align-items:flex-end;height:34px}.eqbars i{width:6px;height:6px;border-radius:3px;background:linear-gradient(var(--b),var(--p))}.eqbars.on i{animation:eq 1s infinite ease-in-out}.eqbars.on i:nth-child(2){animation-delay:.2s}.eqbars.on i:nth-child(3){animation-delay:.4s}.eqbars.on i:nth-child(4){animation-delay:.1s}.eqbars.on i:nth-child(5){animation-delay:.3s}@keyframes eq{0%,100%{height:6px}50%{height:32px}}
.plist{margin-top:6px}.plh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.list li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--s1);border:1px solid transparent}.list li[data-act]{cursor:pointer}.list li.cur{border-color:#8b5cf666;background:#8b5cf614}
.mini{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none}.meta{display:flex;flex-direction:column;min-width:0;flex:1}.meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{color:var(--mu)}
.ops{display:flex;gap:2px}.ops button{width:32px;height:32px;border:0;border-radius:10px;background:transparent;color:var(--mu);display:grid;place-items:center}.ops svg{width:16px;fill:currentColor}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:#fff;border-radius:2px;animation:eq2 .9s infinite ease-in-out}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}@keyframes eq2{0%,100%{height:4px}50%{height:15px}}
.empty{color:var(--mu);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);z-index:20;animation:fade .2s both}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);max-height:88dvh;background:var(--s1);border-top-left-radius:28px;border-top-right-radius:28px;border:1px solid var(--line);z-index:21;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.9,.3,1) both}@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--s3);margin:8px auto 0}.sh-h{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 4px}.sh-b{padding:4px 18px calc(var(--sab) + 24px);overflow:auto}
.rowi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}.av svg{width:20px;fill:#fff}.tag{font-style:normal;font-size:.68rem;background:#8b5cf633;color:#c4b5fd;border-radius:6px;padding:1px 6px;margin-left:4px}
.kv{display:flex;justify-content:space-between;padding:6px 0;gap:10px}.kv span{color:var(--mu)}.log{font-size:.8rem;color:var(--mu);display:flex;flex-direction:column;gap:3px;max-height:130px;overflow:auto;background:var(--s2);padding:10px;border-radius:12px}.log time{color:#6b6b82;margin-right:4px}
.tap{position:fixed;inset:0;z-index:30;background:#000c;display:grid;place-items:center;padding:30px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 28px);transform:translateX(-50%);background:var(--s3);padding:10px 16px;border-radius:99px;z-index:40;font-size:.9rem;box-shadow:0 10px 30px #000a;animation:fade .2s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

#app.still .fade,#app.still .sheet,#app.still .sheet-bg,#app.still .toast{animation:none!important}
</style>

        var b = bin.read();

        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

            } else {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }
      return bytes;
    };

      '<div class="prog"><input type="range" id="seek" min="0" max="1000" value="0" ' + (isHost && tr ? '' : 'disabled') + ' aria-label="Seek"><div class="times"><span id="tpos">0:00</span><span id="tdur">' + fmt(dur) + '</span></div></div>' +
      (isHost ? '<div class="ctl"><button class="cbtn" data-act="prev" aria-label="Previous">' + ICONS.prev + '</button><button class="cbtn main" data-act="toggle" aria-label="Play or pause" ' + (c.tracks.length ? '' : 'disabled') + '>' + (playing ? ICONS.pause : ICONS.play) + '</button><button class="cbtn" data-act="next" aria-label="Next">' + ICONS.next + '</button></div>' +
        '<div class="vol">' + ICONS.vol + '<input type="range" id="vol" min="0" max="100" value="' + Math.round((st.vol == null ? 1 : st.vol) * 100) + '" aria-label="Volume"></div>'
        : '<div class="listen"><div class="eqbars ' + (playing ? 'on' : '') + '"><i></i><i></i><i></i><i></i><i></i></div><span>' + (playing ? 'Listening in sync' : 'Ready to listen') + '</span></div>' + (isIOS ? '<p class="fine c">Use your volume buttons to adjust loudness.</p>' : '<div class="vol">' + ICONS.vol + '<input type="range" id="lvol" min="0" max="100" value="100" aria-label="My volume"></div>')) +
      '<p class="fine c">' + listeners + ' of ' + total + ' friend' + (total === 1 ? '' : 's') + ' connected</p></section>' +
      '<section class="plist"><div class="plh"><h3>Playlist · ' + c.tracks.length + '</h3>' + (isHost ? '<label class="btn soft sm" for="files">' + ICONS.plus + ' Add songs</label>' : '') + '</div>' + trackList(c, isHost) + '</section>' +
      (A.needTap ? '<div class="tap" data-act="tap"><div class="card"><b>Tap to enable sound</b><p class="fine">Your browser needs one tap before it can play audio.</p></div></div>' : '') +
      '</main>';
  }

  function vSheet() {
    if (!A.sheet) return '';
    const isHost = A.role === 'host';
    let body = '', title = '';
    if (A.sheet === 'friends') {
      title = 'Friends';
      const roster = isHost ? host.roster() : client.roster;
      if (isHost && host.pending.size) {
        body += '<h4>Join requests</h4>' + [...host.pending.values()].map((r) => '<div class="rowi req"><span class="av" style="background:hsl(' + hue(r.name) + ' 65% 45%)">' + esc(r.name[0]) + '</span><span class="meta"><b>' + esc(r.name) + '</b><small>wants to join</small></span><button class="btn ok sm" data-act="approve" data-id="' + r.id + '">Approve</button><button class="btn danger sm" data-act="reject" data-id="' + r.id + '">Reject</button></div>').join('');
      }
      body += '<h4>In the party · ' + roster.length + '/10</h4>' + roster.map((r) => {
        const kick = isHost && r.role !== 'master' ? '<button class="btn ghost sm" data-act="kick" data-id="' + esc(r.id) + '" data-name="' + esc(r.name) + '">Remove</button>' : '';
        return '<div class="rowi"><span class="av" style="background:hsl(' + hue(r.name) + ' 65% 45%)">' + (r.role === 'master' ? ICONS.crown : esc(r.name[0] || '?')) + '</span><span class="meta"><b>' + esc(r.name) + (r.role === 'master' ? ' <em class="tag">Master</em>' : '') + '</b><small><i class="dot ' + statusDot[r.status] + '"></i>' + statusLabel[r.status] + (r.role !== 'master' && r.have < 1 ? ' · songs ' + Math.round(r.have * 100) + '%' : '') + '</small></span>' + kick + '</div>';
      }).join('');
    } else if (A.sheet === 'settings') {
      title = isHost ? 'Party settings' : 'Party';
      const off = player.userOffset;
      const tune = '<h4>Fine-tune this phone</h4><div class="card"><div class="kv"><span>Audio delay compensation</span><b id="offv">' + (off > 0 ? '+' : '') + off + ' ms</b></div><input type="range" id="offs" min="-300" max="300" step="5" value="' + off + '" aria-label="Audio delay compensation"><p class="fine">Hearing this phone <b>later</b> than the host? Slide right. <b>Earlier</b>? Slide left. Needed mostly with Bluetooth speakers or slower phones. Saved on this phone.</p></div>';
      if (isHost) {
        body += '<div class="card"><div class="kv"><span>Party</span><b>' + esc(A.eventName) + '</b></div><div class="kv"><span>Code</span><b class="mono">' + esc(A.code.slice(0, 4) + ' ' + A.code.slice(4)) + '</b></div><div class="kv"><span>Status</span><b>' + (host.locked ? 'Locked' : 'Open to requests') + '</b></div></div>' +
          '<div class="qr sm">' + qrSvg(link()) + '</div><div class="row"><button class="btn soft" data-act="copy" data-v="' + esc(link()) + '">Copy link</button><button class="btn soft" data-act="share">Share…</button></div>' +
          '<button class="btn ' + (host.locked ? 'primary' : 'soft') + ' wide" data-act="lock">' + (host.locked ? 'Unlock party' : 'Lock party (no new requests)') + '</button>' +
          '<h4>Activity log</h4><div class="log">' + (host.audit.slice(-15).reverse().map((a) => '<div><time>' + new Date(a.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</time> ' + esc(a.action) + (a.who && a.who !== 'host' ? ' · ' + esc(a.who) : '') + (typeof a.meta === 'string' ? ' · ' + esc(a.meta) : '') + '</div>').join('') || '<div>Nothing yet</div>') + '</div>' +
          tune + '<button class="btn danger wide" data-act="end">End party for everyone</button>';
      } else {
        const c = client;
        body += '<div class="card"><div class="kv"><span>Party</span><b>' + esc(A.eventName) + '</b></div><div class="kv"><span>Sync</span><b>' + esc(c.syncLabel) + '</b></div><div class="kv"><span>Clock offset error (RTT)</span><b>' + (c.rtt == null ? '–' : Math.round(c.rtt) + ' ms') + '</b></div><div class="kv"><span>Last drift</span><b>' + Math.round(c.lastDrift) + ' ms</b></div></div>' +
          tune + '<button class="btn danger wide" data-act="leave">Leave party</button>';
      }
    } else if (A.sheet === 'profile') {
      title = 'Profile';
      body += '<label class="field"><span>Display name</span><input id="pn" maxlength="24" value="' + esc(A.name) + '"></label><p class="fine">Changes apply the next time you host or join.</p>' +
        '<div class="card"><b>Install as an app</b><p class="fine">' + (isIOS ? 'iPhone: tap Share, then “Add to Home Screen”.' : 'Android: browser menu, then “Install app” / “Add to Home screen”.') + '</p></div>' +
        '<div class="card"><b>Good to know</b><p class="fine">Audio plays only from files you add. Keep the host phone awake and the app open. Sync is typically within 100–250 ms; Bluetooth speakers add their own delay.</p></div>';
    }
    return '<div class="sheet-bg" data-act="closeSheet"></div><aside class="sheet"><div class="grab"></div><div class="sh-h"><h3>' + title + '</h3><button class="ibtn" data-act="closeSheet" aria-label="Close">' + ICONS.x + '</button></div><div class="sh-b">' + body + '</div></aside>';
  }

  // ------------------------------------------------------------------ render
  const root = $('#app');
  let rq = 0, lastHtml = '', lastKey = '';
  function render(force) {
    if (!force) { const ae = document.activeElement; if (ae && ae.tagName === 'INPUT' && ae.type === 'text' && root.contains(ae)) return; if (dragging) return; const ae2 = document.activeElement; if (ae2 && ae2.id === 'offs') return; }
    cancelAnimationFrame(rq);
    rq = requestAnimationFrame(() => {
      let html = '';
      try {
        if (A.view === 'welcome') html = vWelcome();
        else if (A.view === 'create') html = vCreate();
        else if (A.view === 'invite') html = vInvite();
        else if (A.view === 'join') html = vJoin();
        else if (A.view === 'waiting') html = vWaiting();
        else if (A.view === 'player') html = vPlayer();
        if (A.view === 'player' || A.view === 'invite') html += vSheet();
      } catch (e) { html = '<main class="screen center"><h2>Something went wrong</h2><button class="btn primary" data-act="home">Restart</button></main>'; console.error(e); }
      if (A.toast) html += '<div class="toast">' + esc(A.toast) + '</div>';
      if (html === lastHtml && !force) return;
      lastHtml = html;
      const sb = root.querySelector('.sh-b'), top = sb ? sb.scrollTop : 0, shOpen = !!sb;
      const key = A.view + '|' + (A.sheet || '') + '|' + (A.needTap ? 1 : 0);
      root.classList.toggle('still', key === lastKey); lastKey = key;
      root.innerHTML = html;
      document.body.dataset.view = A.view;
      const sb2 = root.querySelector('.sh-b'); if (sb2 && shOpen) sb2.scrollTop = top;
      bindAfterRender(); updateProgress();
    });
  }
  function bindAfterRender() {
    const nm = $('#nm'); if (nm) nm.oninput = () => { A.name = SP.sanitizeName(nm.value); store.set('sp_name', A.name); };
    const en = $('#en'); if (en) en.oninput = () => { A.eventName = SP.sanitizeName(en.value); };
    const jc = $('#jc'); if (jc) jc.oninput = () => { const v = SP.normalizeCode(jc.value); A.joinCode = v; jc.value = v.length > 4 ? v.slice(0, 4) + ' ' + v.slice(4) : v; };
    const pn = $('#pn'); if (pn) pn.onchange = () => { A.name = SP.sanitizeName(pn.value); store.set('sp_name', A.name); toast('Saved'); };
    const sk = $('#seek');
    if (sk) {
      sk.oninput = () => { dragging = true; const d = (A.role === 'host' ? hostClient : client); const tr = d.tracks.find((t) => t.id === (d.state || {}).trackId); const dur = (player.durationMs() || (tr && tr.durationMs) || 0); const e = $('#tpos'); if (e) e.textContent = fmt(sk.value / 1000 * dur); };
      sk.onchange = () => { dragging = false; const tr = hostClient.tracks.find((t) => t.id === (hostClient.state || {}).trackId); const dur = (player.durationMs() || (tr && tr.durationMs) || 0); host.seek(sk.value / 1000 * dur); };
    }
    const vo = $('#vol'); if (vo) vo.oninput = () => { clearTimeout(vo._t); vo._t = setTimeout(() => host.setVolume(vo.value / 100), 80); };
    const os = $('#offs'); if (os) { os.oninput = () => { const v = +os.value; const e = $('#offv'); if (e) e.textContent = (v > 0 ? '+' : '') + v + ' ms'; }; os.onchange = () => { player.userOffset = +os.value; store.set('sp_offset', player.userOffset); const c = A.role === 'host' ? hostClient : client; if (c) { c.appliedKey = null; c.applyState(); } }; }
    const lv = $('#lvol'); if (lv) lv.oninput = () => player.setVolume(lv.value / 100);
  }
  setInterval(() => { if (A.view === 'player' || A.view === 'waiting') render(); }, 1000);
  // progress bar + clock updated outside the main render
  function updateProgress() {
    if (A.view !== 'player') return;
    const c = A.role === 'host' ? hostClient : client; if (!c || !c.state) return;
    const tr = c.tracks.find((t) => t.id === c.state.trackId); if (!tr) return;
    const dur = player.durationMs() || tr.durationMs || 0;
    let pos = c.position(); if (dur) pos = Math.min(pos, dur);
    const sk = $('#seek'), tp = $('#tpos'), td = $('#tdur');
    if (!dragging) { if (sk && dur) sk.value = Math.round(pos / dur * 1000); if (tp) tp.textContent = fmt(pos); }
    if (td && dur) td.textContent = fmt(dur);
  }
  setInterval(updateProgress, 250);

  // ------------------------------------------------------------------ actions
  const actions = Object.assign({}, {
    toCreate: () => { if (!A.name) { toast('Enter your display name first'); return; } player.unlock(); A.eventName = A.eventName || ''; go('create'); },
    toJoin: () => { if (!A.name) { toast('Enter your display name first'); return; } go('join'); },
    home: () => { if (A.role) teardown(); go('welcome'); },
    create: () => {
      const en = SP.sanitizeName(($('#en') || {}).value || A.eventName);
      if (!en) { toast('Give your party a name'); return; }
      player.unlock();
      createHost(en, SP.randomCode(), null); saveHost(); go('invite');
    },
    resumeHost: () => {
      const sh = store.get('sp_host', null); if (!sh) return;
      if (!A.name) A.name = sh.name || '';
      player.unlock(); createHost(sh.eventName, sh.code, sh.data); toast('Party resumed. Re-add your songs.'); go('player');
    },
    enter: () => { A.sheet = null; go('player'); },
    join: () => {
      const code = SP.normalizeCode(A.joinCode || ($('#jc') || {}).value);
      const nm = SP.sanitizeName(A.name || ($('#nm') || {}).value);
      if (code.length !== 8) { A.err = 'Enter the 8-character party code.'; render(true); return; }
      if (!nm) { A.err = 'Enter your display name.'; render(true); return; }
      A.name = nm; store.set('sp_name', nm); player.unlock();
      createGuest(code, nm); go('waiting');
    },
    rejoin: () => { const g = store.get('sp_guest', null); if (!g) return; A.name = g.name || A.name; player.unlock(); createGuest(g.code, A.name || 'Guest'); go('waiting'); },
    leave: () => { const wasGuest = A.role === 'guest'; if (wasGuest) store.del('sp_guest'); teardown(); go('welcome'); },
    sheet: (d) => { A.sheet = d.s; render(true); }, closeSheet: () => { A.sheet = null; render(true); },
    copy: (d) => { const v = d.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Link copied'), () => { prompt('Copy this link', v); }); },
    share: () => { const t = 'Join my SyncParty “' + A.eventName + '”. Code: ' + A.code; if (navigator.share) navigator.share({ title: 'SyncParty', text: t, url: link() }).catch(() => {}); else actions.copy({ v: link() }); },
    tap: () => { A.needTap = false; player.unlock(); const c = A.role === 'host' ? hostClient : client; if (c) setTimeout(() => c.applyState(), 80); render(true); },
  }, hostActions);
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act; if (!actions[a]) return;
    if (t.closest('.ops') && a === 'pick') return;
    if (a === 'pick' && e.target.closest('button')) return;
    if (['toggle', 'next', 'prev', 'pick', 'up', 'down', 'rm', 'approve', 'reject', 'kick', 'lock', 'end'].includes(a) && A.role !== 'host') return; // UI guard (the real enforcement is in HostCore)
    e.stopPropagation(); actions[a](t.dataset);
  });

  // ------------------------------------------------------------------ boot
  { const f = $('#files'); f.onchange = () => { if (host) addFiles(f.files); f.value = ''; }; }
  const m = location.hash.match(/join=([A-Za-z0-9]{8})/);
  if (m) { A.joinCode = m[1].toUpperCase(); A.view = A.name ? 'join' : 'welcome'; if (!A.name) A.view = 'join'; }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__SP = { A, get host() { return host; }, get client() { return client; } };
  render(true);
})();
</script>
</body>
</html>
